
<!--
===============================================================================
DOCUMENTAÇÃO COMPLETA DO TEMPLATE

FINALIDADE:
Este arquivo pertence à camada de apresentação (View) da aplicação Flask/Jinja2.

CONCEITOS IMPORTANTES:
- CRUD = Create (Criar), Read (Consultar/Listar), Update (Atualizar), Delete (Excluir).
- Formulários normalmente representam operações CREATE ou UPDATE.
- Tabelas normalmente representam operações READ.
- Botões Editar representam UPDATE.
- Botões Excluir/Remover representam DELETE.
- Variáveis Jinja recebem dados enviados pelo backend Flask.
- Estruturas Jinja IF executam lógica condicional.
- Estruturas Jinja FOR percorrem listas e registros do banco de dados.
- EXTENDS herda layout de outro template.
- BLOCK define regiões personalizáveis da página.

FLUXO:
Usuário -> Rota Flask -> Banco de Dados -> Template -> Navegador
===============================================================================
-->

<!-- HERANÇA DE TEMPLATE BASE -->
{% extends 'base.html' %} <!-- Herda o layout base do sistema -->

<!-- INÍCIO DE BLOCO PERSONALIZÁVEL -->
{% block titulo %}Usuários — WellNest Clinic{% endblock %}
<!-- FIM DE BLOCO --> <!-- Define o título da página -->

<!-- INÍCIO DE BLOCO PERSONALIZÁVEL -->
{% block conteudo %} <!-- Início do conteúdo principal -->
<div class="fade-in"> <!-- Container com efeito de fade-in -->

    <!-- Cabeçalho da página -->
    <div class="page-heading">
        <h2 class="text-primary-custom">
            <i class="bi bi-people-fill me-2"></i>Usuários
        </h2>

        <!-- Botão para adicionar novo usuário -->
        <a href="{{ url_for('inserir_usuario') }}" class="btn btn-primary-custom">
            <i class="bi bi-plus-circle me-1"></i>Novo Usuário
        </a>
    </div>

    <!-- Barra de estatísticas -->
    <div class="stats-bar">
        <div class="stat-pill">
            <i class="bi bi-people-fill"></i>

            <!-- Quantidade total de usuários -->
            <span>{{ usuarios|length }} usuários</span>
        </div>
    </div>

    <!-- Tabela responsiva de usuários -->
    <div class="table-responsive">
        <!-- TABELA: normalmente usada para READ/LISTAGEM do CRUD -->
<table class="table table-hover table-bordered align-middle mb-0">

            <!-- Cabeçalho da tabela -->
            <thead class="table-header-custom">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Perfil</th>
                    <th class="text-center" style="width:180px">Ações</th>
                </tr>
            </thead>

            <!-- Corpo da tabela -->
            <tbody>

                <!-- Loop pelos usuários -->
                <!-- LOOP: percorre registros vindos do banco de dados -->
{% for u in usuarios %}
                <tr>

                    <!-- ID do usuário -->
                    <td class="fw-semibold text-muted">{{ u.id }}</td>

                    <!-- Nome do usuário -->
                    <td class="fw-semibold">{{ u.nome }}</td>

                    <!-- Email do usuário -->
                    <td>{{ u.email }}</td>

                    <!-- Perfil do usuário -->
                    <td>
                        <span class="badge bg-info-custom">{{ u.perfil }}</span>
                    </td>

                    <!-- Ações (editar/excluir) -->
                    <td class="text-center">

                        <!-- Botão editar -->
                        <!-- BOTÃO DE AÇÃO -->
<button class="btn btn-sm btn-warning me-1" title="Editar">
                            <i class="bi bi-pencil-fill"></i> Editar
                        </button>

                        <!-- Botão excluir -->
                        <!-- BOTÃO DE AÇÃO -->
<button class="btn btn-sm btn-danger btn-excluir" title="Excluir">
                            <i class="bi bi-trash-fill"></i> Excluir
                        </button>

                    </td>
                </tr>
                {% endfor %}
<!-- FIM DO LOOP --> <!-- Fim do loop de usuários -->

            </tbody>
        </table>
    </div>
</div>
{% endblock %}
<!-- FIM DE BLOCO --> <!-- Fim do conteúdo principal -->
