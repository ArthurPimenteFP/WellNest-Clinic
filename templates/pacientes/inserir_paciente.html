
<!--
===============================================================================
DOCUMENTAÇÃO COMPLETA DO TEMPLATE

FINALIDADE:
Este arquivo pertence à camada de apresentação (View) da aplicação Flask/Jinja2.

CONCEITOS IMPORTANTES:
- CRUD = Create (Criar), Read (Consultar/Listar), Update (Atualizar), Delete (Excluir).
- Formulários normalmente representam operações CREATE ou UPDATE.
- Tabelas normalmente representam operações READ.
- Botões Editar representam UPDATE.
- Botões Excluir/Remover representam DELETE.
- Variáveis Jinja recebem dados enviados pelo backend Flask.
- Estruturas Jinja IF executam lógica condicional.
- Estruturas Jinja FOR percorrem listas e registros do banco de dados.
- EXTENDS herda layout de outro template.
- BLOCK define regiões personalizáveis da página.

FLUXO:
Usuário -> Rota Flask -> Banco de Dados -> Template -> Navegador
===============================================================================
-->

<!-- HERANÇA DE TEMPLATE BASE -->
{% extends 'base.html' %} <!-- Herda o layout base -->

<!-- INÍCIO DE BLOCO PERSONALIZÁVEL -->
{% block titulo %}Novo Paciente — WellNest Clinic{% endblock %}
<!-- FIM DE BLOCO --> <!-- Título da página -->

<!-- INÍCIO DE BLOCO PERSONALIZÁVEL -->
{% block conteudo %} <!-- Início do conteúdo -->
<div class="fade-in"> <!-- Container com animação -->

    <!-- Cabeçalho da página -->
    <div class="page-heading">
        <h2 class="text-primary-custom">
            <i class="bi bi-person-plus-fill me-2"></i>Novo Paciente
        </h2>
    </div>

    <!-- Card principal -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">

            <!-- Formulário para cadastro de paciente -->
            <!-- FORMULÁRIO: geralmente usado para CREATE ou UPDATE do CRUD -->
<form method="POST" action="{{ url_for('inserir_paciente') }}">

                <!-- Linha: nome e CPF -->
                <div class="row">

                    <!-- Campo nome completo -->
                    <div class="col-md-6 mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <!-- CAMPO DE ENTRADA DE DADOS -->
<input type="text" class="form-control" id="nome" name="nome"
                               placeholder="Nome completo do paciente" required>
                    </div>

                    <!-- Campo CPF -->
                    <div class="col-md-6 mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <!-- CAMPO DE ENTRADA DE DADOS -->
<input type="text" class="form-control" id="cpf" name="cpf"
                               placeholder="000.000.000-00" required>
                    </div>
                </div>

                <!-- Linha: telefone e email -->
                <div class="row">

                    <!-- Campo telefone -->
                    <div class="col-md-6 mb-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <!-- CAMPO DE ENTRADA DE DADOS -->
<input type="tel" class="form-control" id="telefone" name="telefone"
                               placeholder="(11) 99999-9999" required>
                    </div>

                    <!-- Campo email -->
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <!-- CAMPO DE ENTRADA DE DADOS -->
<input type="email" class="form-control" id="email" name="email"
                               placeholder="paciente@email.com" required>
                    </div>
                </div>

                <!-- Linha: convênio -->
                <div class="row">

                    <!-- Seleção de convênio -->
                    <div class="col-md-6 mb-3">
                        <label for="convenio" class="form-label">Convênio</label>
                        <select class="form-select" id="convenio" name="convenio">
                            <option value="" selected disabled>Selecione o convênio</option>
                            <option value="Unimed">Unimed</option>
                            <option value="Amil">Amil</option>
                            <option value="SulAmérica">SulAmérica</option>
                            <option value="Bradesco Saúde">Bradesco Saúde</option>
                            <option value="Particular">Particular</option>
                        </select>
                    </div>
                </div>

                <!-- Botões de ação -->
                <div class="d-flex gap-2 mt-3">

                    <!-- Botão salvar -->
                    <!-- BOTÃO DE AÇÃO -->
<button type="submit" class="btn btn-primary-custom">
                        <i class="bi bi-check-circle me-1"></i>Salvar
                    </button>

                    <!-- Botão cancelar -->
                    <a href="{{ url_for('listar_pacientes') }}" class="btn btn-secondary">
                        <i class="bi bi-x-circle me-1"></i>Cancelar
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
<!-- FIM DE BLOCO --> <!-- Fim do conteúdo -->
