{% extends "base_publica.html" %}
{% block titulo %}Recuperar Senha — WellNest Clinic{% endblock %}

{% block corpo %}
<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">
    <div class="card border-0 shadow-sm" style="width:100%;max-width:420px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-key-fill text-primary" style="font-size:2.5rem;"></i>
                <h4 class="fw-bold mt-2 mb-0">Recuperar Senha</h4>
                <p class="text-muted small">Informe seu e-mail para continuar</p>
            </div>
            <form action="#" method="POST">
                <div class="mb-4">
                    <label class="form-label fw-semibold">E-mail cadastrado</label>
                    <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-envelope me-2"></i>Enviar instruções
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}" class="text-muted small">Voltar ao login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
