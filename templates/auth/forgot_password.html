
<!--
===============================================================================
DOCUMENTAÇÃO COMPLETA DO TEMPLATE

FINALIDADE:
Este arquivo pertence à camada de apresentação (View) da aplicação Flask/Jinja2.

CONCEITOS IMPORTANTES:
- CRUD = Create (Criar), Read (Consultar/Listar), Update (Atualizar), Delete (Excluir).
- Formulários normalmente representam operações CREATE ou UPDATE.
- Tabelas normalmente representam operações READ.
- Botões Editar representam UPDATE.
- Botões Excluir/Remover representam DELETE.
- Variáveis Jinja recebem dados enviados pelo backend Flask.
- Estruturas Jinja IF executam lógica condicional.
- Estruturas Jinja FOR percorrem listas e registros do banco de dados.
- EXTENDS herda layout de outro template.
- BLOCK define regiões personalizáveis da página.

FLUXO:
Usuário -> Rota Flask -> Banco de Dados -> Template -> Navegador
===============================================================================
-->

<!-- HERANÇA DE TEMPLATE BASE -->
{% extends "base_publica.html" %}
<!-- INÍCIO DE BLOCO PERSONALIZÁVEL -->
{% block titulo %}Recuperar Senha — WellNest Clinic{% endblock %}
<!-- FIM DE BLOCO -->

<!-- INÍCIO DE BLOCO PERSONALIZÁVEL -->
{% block corpo %}
<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">
    <div class="card border-0 shadow-sm" style="width:100%;max-width:420px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-key-fill text-primary" style="font-size:2.5rem;"></i>
                <h4 class="fw-bold mt-2 mb-0">Recuperar Senha</h4>
                <p class="text-muted small">Informe seu e-mail para continuar</p>
            </div>
            <!-- FORMULÁRIO: geralmente usado para CREATE ou UPDATE do CRUD -->
<form action="#" method="POST">
                <div class="mb-4">
                    <label class="form-label fw-semibold">E-mail cadastrado</label>
                    <!-- CAMPO DE ENTRADA DE DADOS -->
<input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
                </div>
                <!-- BOTÃO DE AÇÃO -->
<button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-envelope me-2"></i>Enviar instruções
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}" class="text-muted small">Voltar ao login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
<!-- FIM DE BLOCO -->
